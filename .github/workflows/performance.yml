name: Performance evidence

on:
  workflow_dispatch:
    inputs:
      full:
        description: Include 100k bonds/policies and large scenario workloads
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CMAKE_ARGS: -DQFIN_STRICT_WARNINGS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      QFIN_COMPILE_COMMANDS: build/benchmark/compile_commands.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" --config-settings=build-dir=build/benchmark
      - name: Public API performance and parity
        shell: bash
        env:
          FULL_BENCHMARK: ${{ github.event_name == 'schedule' || inputs.full }}
        run: |
          args=()
          if [[ "$FULL_BENCHMARK" == 'true' ]]; then args+=(--full); fi
          python examples/native_benchmark.py "${args[@]}" --repeats 3 --output native-performance.md --json-output native-performance.json
          python examples/hardening_benchmark.py --repeats 5 --output hardening-performance.md --json-output hardening-performance.json
          python examples/mlae_benchmark.py --repeats 5 --coverage-repetitions 200 --output mlae-validation.md --json-output mlae-validation.json
          python tools/memory_benchmark.py --repeats 3 --output memory-performance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qfin-performance-${{ github.sha }}
          path: |
            native-performance.*
            mlae-validation.*
            hardening-performance.*
            memory-performance.json
            build/benchmark/compile_commands.json
          if-no-files-found: warn
          retention-days: 90
