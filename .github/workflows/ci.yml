name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  static-quality:
    name: Ruff and strict mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src/qfin

  tests:
    name: tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install optional interoperability and independent validation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install -e ".[qiskit,validation]"
      - name: Verify compiled backends
        run: >-
          python -c "import qfin; info=qfin.system_info();
          assert info['native_extension']; assert info['pennylane_lightning']; print(info)"
      - run: python -m pytest --cov=qfin --cov-report=term-missing --cov-fail-under=88

  native-parity:
    name: native parity and strict C++ warnings
    runs-on: ubuntu-latest
    env:
      CMAKE_ARGS: -DQFIN_STRICT_WARNINGS=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/native tests/finance/test_metamorphic_properties.py tests/finance/test_numerical_reductions.py

  minimum-dependencies:
    name: minimum dependencies / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.0 scipy==1.11.0 pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest

  sanitizers:
    name: native ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
        env:
          CMAKE_ARGS: -DCMAKE_CXX_COMPILER=g++ -DQFIN_STRICT_WARNINGS=ON -DQFIN_ENABLE_SANITIZERS=ON
      - name: Exercise native ownership, malformed buffers, and parity
        shell: bash
        run: |
          export LD_PRELOAD="$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
          python -m pytest tests/native tests/finance/test_metamorphic_properties.py tests/finance/test_numerical_reductions.py
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  examples:
    name: representative examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,qiskit,validation]"
      - run: |
          python examples/quantum_risk_pipeline.py
          python examples/multiperiod_alm.py
          python examples/life_products.py
          python examples/life_scenario_risk.py
          python examples/device_realism.py
          python examples/scalable_representation.py
          python examples/structured_factor_tail.py
          python examples/structured_factor_risk.py
          python examples/fixed_income_accuracy.py

  source-distribution:
    name: sdist clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - run: python -m venv sdist-test
      - run: sdist-test/bin/python -m pip install dist/*.tar.gz
      - run: sdist-test/bin/python examples/wheel_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qfin-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel-smoke:
    name: wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            python-path: wheel-test/bin/python
          - os: ubuntu-latest
            python-version: "3.12"
            python-path: wheel-test/bin/python
          - os: ubuntu-latest
            python-version: "3.13"
            python-path: wheel-test/bin/python
          - os: macos-latest
            python-version: "3.12"
            python-path: wheel-test/bin/python
          - os: windows-latest
            python-version: "3.12"
            python-path: wheel-test/Scripts/python.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m venv wheel-test
      - run: ${{ matrix.python-path }} -m pip install numpy scipy
      - run: ${{ matrix.python-path }} -m pip install --no-index --no-deps --find-links dist qfin-quantum
      - run: ${{ matrix.python-path }} examples/wheel_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qfin-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
