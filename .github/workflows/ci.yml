name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install optional Qiskit export dependency
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install -e ".[qiskit]"
      - name: Verify compiled backends
        run: >-
          python -c "import qfin; info=qfin.system_info();
          assert info['native_extension'];
          assert info['pennylane_lightning'];
          print(info)"
      - run: python -m ruff check .
      - run: python -m mypy src/qfin
      - run: python -m pytest --cov=qfin --cov-report=term-missing --cov-fail-under=78
      - name: Run quantum-risk smoke example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python examples/quantum_risk_pipeline.py
      - name: Run ALM and life 0.6 smoke examples
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python examples/multiperiod_alm.py
          python examples/life_products.py
          python examples/life_scenario_risk.py
      - name: Run device-realism 0.7 smoke example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python examples/device_realism.py
      - name: Run scalable-representation 0.8 smoke example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python examples/scalable_representation.py
      - name: Run structured-oracle 0.9 smoke example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python examples/structured_factor_tail.py
      - name: Run structured factor-risk 1.0 smoke example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python examples/structured_factor_risk.py
      - run: python -m build

  package-smoke:
    name: wheel and sdist smoke test
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed wheel
        run: >-
          wheel-test/bin/python -c "import qfin;
          curve=qfin.YieldCurve([0, 1], [0.02, 0.02]);
          result=qfin.price_bonds([qfin.FixedRateBond(1, 0.02)], curve);
          risk=qfin.compile(qfin.TailProbability(qfin.LossDistribution([0, 1]), 0.5),
          backend='classical', target_error=0.1, min_qubits=2, max_qubits=2);
          factors=qfin.encode_independent_factors([qfin.Normal(), qfin.Normal()],
          qubits_per_factor=2, method='probability');
          strategy=qfin.compare_state_preparation_strategies(factors).require_selected();
          factor_risk=qfin.FactorTailProbability(qfin.FactorizedLossModel(factors,
          qfin.SparseExposureObjective(linear={'factor_0': 1.0})), threshold=0.0);
          factor_compiled=qfin.compile(factor_risk, backend='classical',
          arithmetic_scale=1.0);
          factor_cvar=qfin.compile(qfin.FactorCVaR(factor_risk.model, confidence=0.75),
          backend='classical', target_error=0.2, arithmetic_scale=1.0);
          optimization=qfin.compile(qfin.MeanVarianceProblem([0.04, 0.08],
          [[0.02, 0.0], [0.0, 0.05]]));
          assert qfin.system_info()['native_extension'];
          assert qfin.__version__ == '1.0.0';
          assert result.dirty_prices.shape == (1,);
          assert risk.run().probability == 0.5;
          assert strategy.strategy == 'factorized_marginal_loader';
          assert 0 <= factor_compiled.run().probability <= 1;
          assert factor_cvar.run().cvar >= factor_cvar.run().var;
          assert optimization.run().success;
          print(qfin.system_info())"
      - uses: actions/upload-artifact@v4
        with:
          name: qfin-linux-build
          path: dist/
