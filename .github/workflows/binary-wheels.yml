name: Portable binary wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: cibuildwheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build, repair, and test each exact binary wheel
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-*
          CIBW_SKIP: '*-musllinux* *-win32 *-manylinux_i686'
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_TEST_REQUIRES: pytest hypothesis>=6.100,<7
          CIBW_TEST_COMMAND: >-
            python {project}/examples/wheel_smoke.py &&
            python -m pytest {project}/tests/native {project}/tests/test_reference_corpus.py
          CIBW_ENVIRONMENT: >-
            CMAKE_BUILD_PARALLEL_LEVEL=2 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
            CMAKE_ARGS="-DQFIN_STRICT_WARNINGS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
      - name: Record artifact digests and build context
        run: python tools/release_artifacts.py wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qfin-binary-${{ matrix.os }}
          path: wheelhouse/*
          if-no-files-found: error
