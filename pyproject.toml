[build-system]
requires = [
  "scikit-build-core>=0.10,<1",
  "pybind11>=2.13,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "qfin-quantum"
version = "0.5.0"
description = "A finance-specific modelling and compilation layer for quantum computers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Venkat Kota" }]
keywords = ["quantum computing", "finance", "option pricing", "pennylane"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Programming Language :: C++ :: 20",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
quantum = [
  "pennylane>=0.45,<0.46",
  "pennylane-lightning>=0.45,<0.46",
]
dev = [
  "build>=1.2",
  "cmake>=3.25",
  "mypy>=1.11,<2",
  "pennylane>=0.45,<0.46",
  "pennylane-lightning>=0.45,<0.46",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
qfin = "qfin.__main__:main"

[project.urls]
Documentation = "https://github.com/venkatkota2/qfin#readme"
Repository = "https://github.com/venkatkota2/qfin"
Issues = "https://github.com/venkatkota2/qfin/issues"

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.version = ">=3.20"
wheel.packages = ["src/qfin"]
sdist.include = [
  "cpp/CMakeLists.txt",
  "cpp/bindings/*.cpp",
  "cpp/include/qfin/*.hpp",
  "cpp/src/*.cpp",
  "src/qfin/py.typed",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["qfin"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pennylane", "pennylane.*", "scipy", "scipy.*"]
ignore_missing_imports = true
